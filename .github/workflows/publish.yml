name: Publish to npm

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Test (Ubuntu, Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run

  publish:
    name: Publish to npmjs.org
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Validate version and check npm registry
        id: version_check
        run: node scripts/check-version.mjs

      - name: Publish to npmjs.org
        if: steps.version_check.outputs.should_publish == 'true'
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is missing! Please configure NPM_TOKEN in GitHub repository secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          PKG_NAME="${{ steps.version_check.outputs.name }}"
          PKG_VERSION="${{ steps.version_check.outputs.version }}"

          echo "Publishing ${PKG_NAME}@${PKG_VERSION} to npmjs.org with provenance..."
          if npm publish --access public --provenance; then
            echo "Successfully published with provenance!"
          else
            echo "First attempt returned non-zero. Checking if version was already registered..."
            sleep 3
            VERSIONS=$(npm view "$PKG_NAME" versions --json 2>/dev/null || echo "[]")
            if echo "$VERSIONS" | grep -q "\"$PKG_VERSION\""; then
              echo "Notice: Version $PKG_VERSION is confirmed live on npmjs.org!"
            else
              echo "Attempting publish without provenance fallback..."
              if npm publish --access public; then
                echo "Successfully published without provenance!"
              else
                sleep 2
                VERSIONS_RETRY=$(npm view "$PKG_NAME" versions --json 2>/dev/null || echo "[]")
                if echo "$VERSIONS_RETRY" | grep -q "\"$PKG_VERSION\""; then
                  echo "Notice: Version $PKG_VERSION is confirmed live on npmjs.org!"
                else
                  echo "Error: Publishing failed."
                  exit 1
                fi
              fi
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.version_check.outputs.should_publish == 'true'
        run: |
          VERSION="${{ steps.version_check.outputs.version }}"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes || echo "Release created or handled."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
