<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suno Downloader - Free Suno AI Music Downloader</title>
  <meta name="description" content="Download original high-quality audio and metadata directly from Suno AI. Fast, free, and no account needed.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: #13151f;
      --card-border: #232738;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --gradient: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 9999px;
      color: #c4b5fd;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
    }
    .search-box {
      display: flex;
      gap: 0.5rem;
      background: var(--card-bg);
      padding: 0.5rem;
      border-radius: 1rem;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      margin-bottom: 1.5rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
    }
    input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 1rem;
      padding: 0.75rem 1rem;
      font-family: inherit;
    }
    input[type="text"]::placeholder {
      color: #6b7280;
    }
    button.btn-primary {
      background: var(--gradient);
      color: white;
      border: none;
      outline: none;
      padding: 0.85rem 1.6rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 0.75rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    button.btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    button.btn-primary:active {
      transform: translateY(0);
    }
    button.btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-card {
      display: none;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 1rem;
      border-radius: 0.75rem;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }
    .preview-card {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1.25rem;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .preview-header {
      display: flex;
      gap: 1.25rem;
      padding: 1.5rem;
      align-items: center;
    }
    .cover-img {
      width: 110px;
      height: 110px;
      border-radius: 0.75rem;
      object-fit: cover;
      background: #1f2333;
      flex-shrink: 0;
    }
    .song-meta {
      flex: 1;
      min-width: 0;
    }
    .song-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .song-artist {
      color: var(--accent);
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .tag {
      background: rgba(255,255,255,0.06);
      padding: 0.2rem 0.6rem;
      border-radius: 0.35rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .preview-body {
      padding: 0 1.5rem 1.5rem;
    }
    audio {
      width: 100%;
      height: 40px;
      margin-bottom: 1.25rem;
      border-radius: 0.5rem;
    }
    .actions {
      display: flex;
      gap: 0.75rem;
    }
    .btn-download {
      flex: 1;
      padding: 0.9rem;
      font-size: 1rem;
      text-decoration: none;
      justify-content: center;
    }
    .lyrics-toggle {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      border-radius: 0.75rem;
      padding: 0.75rem;
      width: 100%;
      text-align: left;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .lyrics-content {
      display: none;
      padding: 1rem;
      background: rgba(0,0,0,0.25);
      border-radius: 0.5rem;
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #d1d5db;
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
    }
    footer {
      margin-top: auto;
      padding-top: 3rem;
      text-align: center;
      color: #6b7280;
      font-size: 0.85rem;
    }
    footer a { color: #9ca3af; text-decoration: none; }
    footer a:hover { color: white; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="badge">Cloudflare Edge Powered</span>
      <h1>Suno Music Downloader</h1>
      <p class="subtitle">Download public Suno songs directly with full audio quality.</p>
    </header>

    <div class="search-box">
      <input type="text" id="urlInput" placeholder="Paste Suno song URL (e.g. https://suno.com/song/...)" autocomplete="off">
      <button class="btn-primary" id="fetchBtn" onclick="fetchSong()">
        <span class="spinner" id="spinner"></span>
        <span id="btnText">Get Song</span>
      </button>
    </div>

    <div class="error-card" id="errorBox"></div>

    <div class="preview-card" id="previewCard">
      <div class="preview-header">
        <img src="" alt="Cover" class="cover-img" id="coverImg">
        <div class="song-meta">
          <div class="song-title" id="songTitle"></div>
          <div class="song-artist" id="songArtist"></div>
          <div class="tags" id="songTags"></div>
        </div>
      </div>
      <div class="preview-body">
        <audio id="audioPlayer" controls></audio>
        <div class="actions">
          <a href="#" class="btn-primary btn-download" id="downloadBtn" download>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Download Audio (M4A)
          </a>
        </div>
        <button class="lyrics-toggle" id="lyricsToggle" style="display:none;" onclick="toggleLyrics()">
          <span>View Lyrics</span>
          <span id="lyricsArrow">▼</span>
        </button>
        <div class="lyrics-content" id="lyricsContent"></div>
      </div>
    </div>

    <footer>
      <p>Powered by Cloudflare Pages & Functions &bull; Independent open-source tool</p>
    </footer>
  </div>

  <script>
    async function fetchSong() {
      const urlInput = document.getElementById('urlInput');
      const errorBox = document.getElementById('errorBox');
      const previewCard = document.getElementById('previewCard');
      const fetchBtn = document.getElementById('fetchBtn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btnText');

      const url = urlInput.value.trim();
      if (!url) return;

      errorBox.style.display = 'none';
      previewCard.style.display = 'none';
      fetchBtn.disabled = true;
      spinner.style.display = 'inline-block';
      btnText.textContent = 'Loading...';

      try {
        const res = await fetch(`/api/info?url=${encodeURIComponent(url)}`);
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Failed to find song details.');

        document.getElementById('coverImg').src = data.imageUrl || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" fill="%23222"><rect width="100%" height="100%"/></svg>';
        document.getElementById('songTitle').textContent = data.title;
        document.getElementById('songArtist').textContent = data.artist ? `by ${data.artist}` : '';

        const tagsContainer = document.getElementById('songTags');
        tagsContainer.innerHTML = '';
        if (data.style) {
          data.style.split(',').slice(0, 3).forEach(tag => {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = tag.trim();
            tagsContainer.appendChild(span);
          });
        }
        if (data.duration) {
          const durSpan = document.createElement('span');
          durSpan.className = 'tag';
          durSpan.textContent = `${Math.floor(data.duration / 60)}:${String(Math.floor(data.duration % 60)).padStart(2, '0')}`;
          tagsContainer.appendChild(durSpan);
        }

        const audioPlayer = document.getElementById('audioPlayer');
        audioPlayer.src = data.downloadUrl;

        const downloadBtn = document.getElementById('downloadBtn');
        downloadBtn.href = data.downloadUrl;
        downloadBtn.download = `${data.title}.m4a`;

        const lyricsToggle = document.getElementById('lyricsToggle');
        const lyricsContent = document.getElementById('lyricsContent');
        if (data.lyrics && data.lyrics.trim()) {
          lyricsToggle.style.display = 'flex';
          lyricsContent.textContent = data.lyrics;
        } else {
          lyricsToggle.style.display = 'none';
        }

        previewCard.style.display = 'block';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      } finally {
        fetchBtn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Get Song';
      }
    }

    function toggleLyrics() {
      const content = document.getElementById('lyricsContent');
      const arrow = document.getElementById('lyricsArrow');
      const isOpen = content.style.display === 'block';
      content.style.display = isOpen ? 'none' : 'block';
      arrow.textContent = isOpen ? '▼' : '▲';
    }

    document.getElementById('urlInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') fetchSong();
    });
  </script>
</body>
</html>
